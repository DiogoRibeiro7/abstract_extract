name: Bug report
description: Report a reproducible problem in abstract-extract
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough detail to reproduce it.

        Do not include API keys, credentials, private data, or security exploit details. Use the security policy for vulnerabilities.

  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What went wrong?
      placeholder: Describe the observed behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest example that demonstrates the problem.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Package version or Git commit SHA, if known.
      placeholder: "0.1.0 or abc1234"

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.x"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Operating system, installation method, and other relevant dependencies.

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Add traceback or logs with secrets removed.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed credentials, tokens, and private data from this report.
          required: true
        - label: I confirmed this is not a security vulnerability.
          required: true
