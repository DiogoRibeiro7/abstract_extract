name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy src

      - name: Tests
        run: poetry run pytest --cov=abstract_extract --cov-report=term-missing

      - name: Documentation
        run: poetry run mkdocs build --strict

      - name: Validate package metadata
        run: poetry check

      - name: Build distributions
        run: poetry build

      - name: Smoke test built wheel
        shell: bash
        run: |
          expected_version="$(poetry version -s)"

          python -m venv .package-smoke
          .package-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl

          EXPECTED_VERSION="${expected_version}" .package-smoke/bin/python - <<'PY'
          import importlib.metadata as metadata
          import importlib.resources as resources
          import os

          import abstract_extract

          expected_api = {
              "Article",
              "fetch_all_from_scopus",
              "fetch_from_scopus",
              "get_abstract_from_doi",
              "process_scopus_entries",
              "process_scopus_response",
          }

          assert set(abstract_extract.__all__) == expected_api
          assert metadata.version("abstract-extract") == os.environ["EXPECTED_VERSION"]
          assert resources.files("abstract_extract").joinpath("py.typed").is_file()
          print("Installed wheel smoke test passed.")
          PY

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run tests
        run: poetry run pytest
