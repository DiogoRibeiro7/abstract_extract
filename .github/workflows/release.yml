name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1

      - name: Validate package metadata
        run: poetry check

      - name: Validate tag matches package version
        shell: bash
        run: |
          package_version="$(poetry version -s)"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            echo "Expected tag: ${expected_tag}"
            exit 1
          fi

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy src

      - name: Tests
        run: poetry run pytest --cov=abstract_extract --cov-report=term-missing

      - name: Build distributions
        run: poetry build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*             --generate-notes             --title "${GITHUB_REF_NAME}"             --verify-tag
