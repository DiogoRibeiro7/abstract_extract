minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: poetry run ruff check --fix
        language: system
        types_or:
          - python
          - pyi

      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format
        language: system
        types_or:
          - python
          - pyi

      - id: mypy
        name: mypy
        entry: poetry run mypy src
        language: system
        pass_filenames: false
        types:
          - python
