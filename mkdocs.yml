site_name: abstract-extract
site_description: Typed Python utilities for scholarly metadata and abstract retrieval.
site_url: https://diogoribeiro7.github.io/abstract_extract/
repo_url: https://github.com/DiogoRibeiro7/abstract_extract
repo_name: DiogoRibeiro7/abstract_extract
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Usage: usage.md
  - API reference: api.md
  - Development: development.md
  - Releases: releases.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 Diogo Ribeiro
