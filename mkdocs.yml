site_name: abstract-extract
site_description: Typed Python utilities for scholarly metadata and abstract retrieval.
site_url: https://diogoribeiro7.github.io/abstract_extract/
repo_url: https://github.com/DiogoRibeiro7/abstract_extract
repo_name: DiogoRibeiro7/abstract_extract
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Usage: usage.md
  - API reference: api.md
  - Development: development.md
  - Releases: releases.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

strict: true
